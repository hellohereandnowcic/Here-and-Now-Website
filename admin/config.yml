              - { label: "Statement", name: "statement", widget: "object", fields: [{label: "Heading", name: "heading", widget: "string", required: false}, {label: "Quote", name: "quote", widget: "text"}, {label: "Attribution", name: "attribution", widget: "string", required: false}, {label: "Background colour", name: "background", widget: "select", options: ["paper", "bulletin", "bulletin-a", "bulletin-b", "victims", "victims-a", "victims-b", "archive", "archive-a", "archive-b", "accent"]}] }
              - { label: "Text (no image)", name: "text", widget: "object", fields: [{label: "Heading", name: "heading", widget: "string", required: false}, {label: "Body text", name: "body", widget: "text"}, {label: "Width", name: "width", widget: "select", options: ["narrow", "wide"], default: "narrow"}, {label: "Background colour", name: "background", widget: "select", required: false, options: ["", "paper", "white"]}] }
