              - { label: "FAQ", name: "faq", widget: "object", fields: [{label: "Heading", name: "heading", widget: "string", default: "Good to know"}, {label: "Questions", name: "items", widget: "list", summary: "{{question}}", fields: [{label: "Question", name: "question", widget: "string"}, {label: "Answer", name: "answer", widget: "text"}]}] }
              - { label: "News List", name: "news_list", widget: "object", fields: [{label: "Entries", name: "items", widget: "list", summary: "{{headline}}", fields: [{label: "Date", name: "date", widget: "string", required: false}, {label: "Headline", name: "headline", widget: "string"}, {label: "Body", name: "body", widget: "text"}]}] }
