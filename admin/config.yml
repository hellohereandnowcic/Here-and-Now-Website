# ============================================================================
# DECAP CMS CONFIG — Here & Now Productions
# ============================================================================
#
# ⚠️  THE "backend:" SECTION BELOW IS A PLACEHOLDER. ⚠️
#
# When you register this site at https://decapbridge.com, its dashboard
# will generate the real "backend:" block for you (it knows your specific
# repo, branch, and DecapBridge project details). Copy that generated
# block and use it to REPLACE everything between "backend:" and
# "media_folder:" below. Leave everything from "media_folder:" downward
# exactly as it is — that part defines what shows up in the CMS editor
# and doesn't change based on DecapBridge.
#
# See the setup guide for the full walkthrough.
# ============================================================================

# Use DecapBridge classic auth (required)
backend:
  name: git-gateway
  repo: hellohereandnowcic/Here-and-Now-Website
  branch: main
  identity_url: https://auth.decapbridge.com/sites/7c4756a8-937c-41f6-8355-d67cb99363e9
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://hereandnow.org.uk

media_folder: ""
public_folder: "/"

collections:
  - name: "site"
    label: "Site content"
    files:
      - name: "homepage"
        label: "Homepage"
        file: "content.json"
        fields:
          - label: "Logo (white version, for the blue background)"
            name: "logo"
            widget: "image"

          - label: "Tagline (shown briefly when the page loads)"
            name: "tagline"
            widget: "string"

          - label: "\"What we do\" paragraph"
            name: "about"
            widget: "text"

      - name: "shows"
        label: "What's On"
        file: "content-shows.json"
        fields:
          - label: "Shows"
            name: "shows"
            widget: "list"
            summary: "{{title}}"
            fields:
              - label: "Internal ID (don't change this unless you know why — it links this entry to the right part of the page)"
                name: "id"
                widget: "string"
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Status line (shown on the tile and above the description)", name: "status", widget: "string" }
              - { label: "Description", name: "body", widget: "text" }

      - name: "story"
        label: "Our Story"
        file: "content-story.json"
        fields:
          - label: "Story (leave a blank line between paragraphs)"
            name: "story"
            widget: "text"

      - name: "gallery"
        label: "Looking Back (gallery)"
        file: "content-gallery.json"
        fields:
          - label: "Photos"
            name: "gallery"
            widget: "list"
            summary: "{{caption}}"
            fields:
              - { label: "Photo", name: "image", widget: "image", required: false }
              - { label: "Caption", name: "caption", widget: "string", required: false }

      - name: "ensemble"
        label: "Shipwright Ensemble"
        file: "content-ensemble.json"
        fields:
          - label: "Years"
            name: "ensemble"
            widget: "list"
            summary: "{{year}}"
            fields:
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Artists (names, comma-separated)", name: "names", widget: "text" }

      - name: "team"
        label: "Team"
        file: "content-team.json"
        fields:
          - label: "Team"
            name: "team"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image" }
              - { label: "Bio", name: "bio", widget: "text" }

      - name: "mailinglist"
        label: "Mailing List"
        file: "content-mailinglist.json"
        fields:
          - label: "Mailing list intro text"
            name: "mailing_list_intro"
            widget: "text"
