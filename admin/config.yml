              - { label: "Newsletter sign-up", name: "newsletter", widget: "object", fields: [{label: "Heading", name: "heading", widget: "string", default: "Stay in the loop"}, {label: "Small print", name: "subtext", widget: "string", required: false}, {label: "Background colour", name: "background", widget: "select", options: ["accent", "bulletin", "victims", "archive"]}] }

      - name: "support"
        label: "Support us"
        file: "content-support.json"
        fields:
          - label: "Blocks"
            name: "blocks"
            widget: "list"
            summary: "{{fields.type}} — {{fields.heading}}{{fields.title}}"
            types:
              - { label: "Hero (top banner)", name: "hero", widget: "object", fields: [{label: "Title", name: "title", widget: "string"}, {label: "Subtitle line", name: "meta", widget: "string", required: false}, {label: "Background photo", name: "image", widget: "image", required: false}, {label: "Darken photo for white text", name: "dark", widget: "boolean", default: true}] }
              - { label: "Text (no image)", name: "text", widget: "object", fields: [{label: "Heading", name: "heading", widget: "string", required: false}, {label: "Body text", name: "body", widget: "text"}, {label: "Width", name: "width", widget: "select", options: ["narrow", "wide"], default: "narrow"}, {label: "Background colour", name: "background", widget: "select", required: false, options: ["", "paper", "white"]}] }
              - { label: "Text + Image", name: "text_image", widget: "object", fields: [{label: "Heading", name: "heading", widget: "string", required: false}, {label: "Body text", name: "body", widget: "text"}, {label: "Photo", name: "image", widget: "image", required: false}, {label: "Photo side", name: "position", widget: "select", options: ["left", "right"], default: "right"}, {label: "Background colour", name: "background", widget: "select", required: false, options: ["", "paper", "white", "accent"]}, {label: "Link text", name: "link_text", widget: "string", required: false}, {label: "Link URL", name: "link_url", widget: "string", required: false}] }
              - { label: "Newsletter sign-up", name: "newsletter", widget: "object", fields: [{label: "Heading", name: "heading", widget: "string", default: "Stay in the loop"}, {label: "Small print", name: "subtext", widget: "string", required: false}, {label: "Background colour", name: "background", widget: "select", options: ["accent", "bulletin", "victims", "archive"]}] }

      - name: "news"
        label: "News"
        file: "content-news.json"
        fields:
          - label: "Blocks"
            name: "blocks"
            widget: "list"
            summary: "{{fields.type}} — {{fields.heading}}{{fields.title}}"
            types:
              - { label: "Hero (top banner)", name: "hero", widget: "object", fields: [{label: "Title", name: "title", widget: "string"}, {label: "Subtitle line", name: "meta", widget: "string", required: false}, {label: "Background photo", name: "image", widget: "image", required: false}, {label: "Darken photo for white text", name: "dark", widget: "boolean", default: true}] }
              - { label: "News List", name: "news_list", widget: "object", fields: [{label: "Entries", name: "items", widget: "list", summary: "{{headline}}", fields: [{label: "Date", name: "date", widget: "string", required: false}, {label: "Headline", name: "headline", widget: "string"}, {label: "Body", name: "body", widget: "text"}]}] }
              - { label: "Newsletter sign-up", name: "newsletter", widget: "object", fields: [{label: "Heading", name: "heading", widget: "string", default: "Stay in the loop"}, {label: "Small print", name: "subtext", widget: "string", required: false}, {label: "Background colour", name: "background", widget: "select", options: ["accent", "bulletin", "victims", "archive"]}] }

      # ---------------------------------------------------------------
      # HOMEPAGE — fixed 3-tile layout, not a block list (this is a
      # genuinely one-of-a-kind layout, so its own simple fields instead)
      # ---------------------------------------------------------------
      - name: "homepage"
        label: "Homepage tiles"
        file: "content.json"
        fields:
          - label: "Bulletin tile"
            name: "tile_bulletin"
            widget: "object"
            fields:
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Caption line 1", name: "caption1", widget: "string" }
              - { label: "Caption line 2", name: "caption2", widget: "string" }
          - label: "Victims tile"
            name: "tile_victims"
            widget: "object"
            fields:
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Caption line 1", name: "caption1", widget: "string" }
              - { label: "Caption line 2", name: "caption2", widget: "string" }
          - label: "Archive tile"
            name: "tile_archive"
            widget: "object"
            fields:
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Caption line 1", name: "caption1", widget: "string" }
              - { label: "Caption line 2", name: "caption2", widget: "string" }

      # ---------------------------------------------------------------
      # SITE-WIDE SETTINGS — footer contact details & social links,
      # shown on every page
      # ---------------------------------------------------------------
      - name: "settings"
        label: "Site-wide settings"
        file: "content-settings.json"
        fields:
          - { label: "Contact email", name: "email", widget: "string" }
          - { label: "Address (leave blank if not ready to publish one)", name: "address", widget: "string", required: false }
          - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
          - { label: "Other social links", name: "social", widget: "list", required: false, fields: [{label: "Label", name: "label", widget: "string"}, {label: "URL", name: "url", widget: "string"}] }
